[pytest]
# Configuração mínima e deliberadamente conservadora: os testes existentes
# foram escritos ao longo de meses, metade como script solto com `main()`.
# Nada aqui muda o comportamento deles — só define onde procurar e como
# reportar.

testpaths = tests

# Os arquivos antigos usam dois padrões de nome (`*_test.py` e `test_*.py`).
python_files = test_*.py *_test.py

addopts =
    -q
    --strict-markers
    --tb=short
    --ignore=tests/arch_test.py
    --ignore=tests/data_test.py
    --ignore=tests/flim_test.py

# Os tres testes acima vem da biblioteca FLIM-Python upstream e estao
# quebrados no proprio commit de origem: `flim_test.py` tem IndentationError
# na linha 151 (corpo de funcao vazio), e os outros dois nao importam. Nao
# foram tocados por este projeto -- `git status tests/` os mostra limpos.
#
# Ficam excluidos do run padrao em vez de corrigidos: consertar teste de
# terceiro dentro da arrumacao do repositorio misturaria escopo, e eles nao
# cobrem nada do trabalho de dissertacao. Registrado em vendor/REMOVIDOS.txt.

markers =
    lento: leva mais de ~30 s; excluído do CI rápido com `-m "not lento"`
    gpu: exige CUDA disponível
    ambiente: sanidade do ambiente experimental, não do método

# Os módulos de teste importam `flim_al`, `flim_app` e `pyflim` a partir da
# raiz do repositório.
pythonpath = .
